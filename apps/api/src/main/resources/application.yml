spring:
  application:
    name: sitedirect-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sitedirect}
    username: ${SPRING_DATASOURCE_USERNAME:sitedirect}
    password: ${SPRING_DATASOURCE_PASSWORD:sitedirect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sitedirect:
  jwt:
    secret: ${SITEDIRECT_JWT_SECRET:sitedirect-dev-secret-change-me-use-at-least-32-bytes!!}
    expiration-ms: ${SITEDIRECT_JWT_EXPIRATION_MS:86400000}
  seed:
    admin-email: ${SITEDIRECT_ADMIN_EMAIL:admin@sitedirect.local}
    admin-password: ${SITEDIRECT_ADMIN_PASSWORD:Admin123!}
    admin-name: ${SITEDIRECT_ADMIN_NAME:SiteDirect Admin}
