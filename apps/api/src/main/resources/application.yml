spring:
  application:
    name: sitedirect-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sitedirect}
    username: ${SPRING_DATASOURCE_USERNAME:sitedirect}
    password: ${SPRING_DATASOURCE_PASSWORD:sitedirect}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
