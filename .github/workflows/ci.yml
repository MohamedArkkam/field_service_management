name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  api:
    name: API build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sitedirect
          POSTGRES_USER: sitedirect
          POSTGRES_PASSWORD: sitedirect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitedirect -d sitedirect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sitedirect
          SPRING_DATASOURCE_USERNAME: sitedirect
          SPRING_DATASOURCE_PASSWORD: sitedirect
        run: mvn -B verify

  admin-web:
    name: Admin web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - run: npm ci
      - run: npm run build

  client-web:
    name: Client web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client-web/package-lock.json
      - run: npm ci
      - run: npm run build
