<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1100" height="720" fill="#fafafa"/>
  <text x="550" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">SiteDirect - User and system interaction workflow</text>
  <text x="550" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Locked roles only: Admin / Owner � Site Lead � Client</text>

  <!-- Swimlane headers -->
  <rect x="40" y="80" width="200" height="40" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">Admin Web</text>

  <rect x="260" y="80" width="200" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="360" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">Site Lead Mobile</text>

  <rect x="480" y="80" width="200" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="580" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Client Link</text>

  <rect x="700" y="80" width="360" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="880" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">System (API + PostgreSQL)</text>

  <!-- Step 1 -->
  <text x="20" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">1</text>
  <rect x="40" y="145" width="200" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="140" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Create project</text>
  <text x="140" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">milestones � priority/value</text>
  <line x1="240" y1="170" x2="700" y2="170" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="145" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Save project master data</text>

  <!-- Step 2 -->
  <text x="20" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">2</text>
  <rect x="40" y="215" width="200" height="50" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="140" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Assign Site Lead</text>
  <text x="140" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1d4ed8">+ issue client link</text>
  <line x1="240" y1="240" x2="700" y2="240" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="215" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Link users to project � open progress door</text>

  <!-- Step 3 -->
  <text x="20" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">3</text>
  <rect x="260" y="285" width="200" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#14532d">Set checklist + deadline</text>
  <text x="360" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">what must finish by when</text>
  <line x1="460" y1="310" x2="700" y2="310" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="285" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Store direction items</text>

  <!-- Step 4 -->
  <text x="20" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">4</text>
  <rect x="260" y="355" width="200" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#14532d">Log proof</text>
  <text x="360" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">photos � notes (internal)</text>
  <line x1="460" y1="380" x2="700" y2="380" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="355" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Store unpublished progress</text>

  <!-- Step 5 -->
  <text x="20" y="445" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">5</text>
  <rect x="260" y="425" width="200" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#14532d">Approve + rate</text>
  <text x="360" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">publish gate</text>
  <line x1="460" y1="450" x2="700" y2="450" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="425" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Mark progress client-visible</text>

  <!-- Step 6 -->
  <text x="20" y="515" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">6</text>
  <rect x="480" y="495" width="200" height="50" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="580" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9a3412">Open progress link</text>
  <text x="580" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#c2410c">what is happening / done</text>
  <line x1="680" y1="520" x2="700" y2="520" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="495" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Return approved progress only</text>
  <path d="M700 545 C640 575, 620 575, 580 545" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="640" y="575" font-family="Arial, sans-serif" font-size="10" fill="#166534">read-only � no bills/wages</text>

  <!-- Step 7 -->
  <text x="20" y="615" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">7</text>
  <rect x="260" y="595" width="200" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="360" y="617" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#14532d">Log bills + labour</text>
  <text x="360" y="633" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">Unpaid / Partial / Paid</text>
  <line x1="460" y1="620" x2="700" y2="620" stroke="#1f2937" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="700" y="595" width="360" height="50" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="880" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5b21b6">Store internal commercial records</text>

  <!-- Step 8 -->
  <text x="20" y="685" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7280">8</text>
  <rect x="40" y="665" width="200" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="140" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a8a">Oversee portfolio</text>
  <line x1="240" y1="685" x2="700" y2="645" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="420" y="655" font-family="Arial, sans-serif" font-size="10" fill="#166534">read: progress signal + outstanding bills/labour</text>
</svg>
