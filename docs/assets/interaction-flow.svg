<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect width="1100" height="480" fill="#fafafa"/>
  <text x="550" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#111827">SiteDirect interaction mock (locked roles only)</text>

  <!-- Left: Site Lead -->
  <rect x="40" y="70" width="220" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Site Lead Mobile</text>
  <text x="150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9">checklist · photos · bills · labour</text>

  <!-- Left: Admin -->
  <rect x="40" y="200" width="220" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Admin Web</text>
  <text x="150" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9">projects · priority · oversee</text>

  <!-- Left: Client -->
  <rect x="40" y="330" width="220" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d">Client Progress Link</text>
  <text x="150" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">view only · progress only</text>

  <!-- Center API -->
  <rect x="420" y="180" width="220" height="90" rx="10" fill="#7c3aed"/>
  <text x="530" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Core API</text>
  <text x="530" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ede9fe">roles · publish rules</text>

  <!-- Right DB -->
  <rect x="800" y="110" width="240" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="920" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">PostgreSQL</text>
  <text x="920" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9">sites · progress · bills · labour</text>

  <!-- Right Admin dash -->
  <rect x="800" y="220" width="240" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="920" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Admin dashboard</text>
  <text x="920" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6d28d9">all sites · internal money/labour</text>

  <!-- Right Client -->
  <rect x="800" y="330" width="240" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="920" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#14532d">Client view</text>
  <text x="920" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">approved progress only</text>

  <!-- Arrows -->
  <line x1="260" y1="105" x2="420" y2="200" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="140" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">write + publish</text>

  <line x1="260" y1="235" x2="420" y2="230" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="225" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">setup / oversee</text>

  <line x1="260" y1="365" x2="420" y2="250" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="330" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">request progress</text>

  <line x1="640" y1="210" x2="800" y2="150" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="165" font-family="Arial, sans-serif" font-size="11" fill="#1f2937">store / read</text>

  <line x1="640" y1="240" x2="800" y2="255" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="11" fill="#166534">internal read</text>

  <line x1="640" y1="250" x2="800" y2="360" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="700" y="330" font-family="Arial, sans-serif" font-size="11" fill="#166534">read-only</text>

  <text x="550" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">3-tier modular monolith · no store-keeper · no offline-first in v1 · no client finance</text>
</svg>
