services:
  postgres:
    image: postgres:16-alpine
    container_name: sitedirect-postgres
    environment:
      POSTGRES_DB: sitedirect
      POSTGRES_USER: sitedirect
      POSTGRES_PASSWORD: sitedirect
    ports:
      - "5432:5432"
    volumes:
      - sitedirect_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitedirect -d sitedirect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sitedirect_pg_data:
